# The components CI actually uses: `rustfmt` for `format-check`, `clippy` for
# `lint`, `llvm-tools-preview` for `coverage`. `rust-analyzer` is deliberately
# absent — it is an IDE component no task here runs, and requiring it made every
# `cargo` invocation on a clean runner download it (see issue #55). A developer
# who wants it runs `rustup component add rust-analyzer`.
#
# The channel floats on the latest stable release, locally and in CI (this file
# overrides the toolchain the CI workflows install), so there is nothing to
# bump by hand and new syntax, lints and compiler speed arrive when Rust ships
# them. Rust releases are backwards compatible; what a new one can break is
# usually a new clippy lint under `-D warnings`, as in issue #127, and that is
# fixed in this repository when it lands rather than avoided by pinning.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
