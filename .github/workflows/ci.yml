name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    # Only PRs carry an unmerged commit series worth linting; pushes to master are history.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # convco needs full history to walk the commit range
      # convco is a `cargo:` tool, so mise builds it from source and the build
      # needs a toolchain that is pinned here rather than whatever the runner
      # image happens to carry.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mise provisions convco (see mise.toml); the install is cached across
      # runs. Only convco is installed: this job runs nothing else, and building
      # the rest of the table from source is time spent on tools it never calls.
      - uses: jdx/mise-action@v2
        with:
          install_args: cargo:convco
      - name: Conventional Commits check
        run: convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      # env_guard's strongest evidence is differential: it holds its grammar
      # against what real bash, zsh, bun and uv actually do with a value. A
      # missing program fails those tests rather than skipping them, so the
      # runner has to supply every one of them or the property never runs. bash
      # is on the image already.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # Some tests run a copy of the suite as another uid, inside a user
      # namespace `unshare --map-auto --map-root-user` builds, against a
      # directory set-group-ID to a group that uid is not in. A scenario the
      # machine cannot build fails the test rather than skipping it
      # (`journal::tests::cannot_build`), so the runner has to be able to build
      # it. Three things stand in the way on the stock image: Ubuntu's AppArmor
      # policy strips every capability from an unprivileged user namespace, so
      # the `chown` inside it is refused; `--map-auto` needs `newuidmap` and
      # `newgidmap` from `uidmap`; and it needs a subordinate id range for the
      # runner's user to map.
      - name: Allow unprivileged user namespaces with subordinate ids
        run: |
          sudo apt-get install -y uidmap
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          user=$(id -un)
          for file in /etc/subuid /etc/subgid; do
            grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
          done
      - uses: oven-sh/setup-bun@v2
      # uv is pinned, not floated: the test that holds
      # `Reason::DeclaredRootItself` to a real uv (its executable directory is
      # `$XDG_DATA_HOME/../bin`) was written against this version, so a uv
      # release that changes the layout fails only at the commit that raises
      # the pin.
      #
      # It comes from this action, not mise.toml's [tools]: mise-action puts
      # mise's shims on PATH, and a shim finds the real binary through
      # XDG_DATA_HOME or the home, which that test redirects into a scratch
      # directory, so a shimmed uv does not run there.
      #
      # setup-uv publishes no floating major past v7, so the ref is an exact
      # release tag, bumped by hand alongside the uv version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
      - name: Check formatting
        run: mise run format-check
      - name: Clippy
        run: mise run lint
      - name: Test
        run: mise run test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    # install.sh runs on machines that have nothing else on them, so a bug there
    # is the one bug a user cannot work around. bench/run.sh gates the startup
    # budget, so a bug there silently disables that gate. scripts/line-check is
    # the file-length gate, which a bug would disable just as silently.
    #
    # Every check runs through the same mise task hk runs locally. shellcheck
    # and actionlint are the only tools this job calls, and `mise run` would
    # otherwise build the rest of the table from source first.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the line check reads the base commit's baseline
      - uses: jdx/mise-action@v2
        with:
          install_args: shellcheck actionlint
      - name: ShellCheck
        run: mise run shellcheck
      # No file may newly exceed the line limit, and the baseline of files
      # already over it may only shrink: it is held against the PR's base, or
      # against master before the push on a push to master.
      - name: Line check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: mise run line-check "$BASE"
      # An action ref that does not resolve fails its job at `Set up job`,
      # having run no step, and actionlint does not check that a ref exists.
      # This step resolves every ref in every workflow against the registry:
      # a tag, a branch or a commit SHA resolves, and a trailing `# vX.Y.Z`
      # comment is stripped. The match is anchored at the start of a line so
      # it does not read this step's own source.
      #
      # A local action (`./…`), a container action (`docker://…`) and a
      # templated ref (`${{ matrix.action }}`) are skipped by name, since no
      # lookup can answer for them. A subdirectory action
      # (`owner/repo/dir@ref`) is resolved on `owner/repo`. None of these forms
      # is used today, so the self-check below exercises each one.
      #
      # It cannot report a broken ref in this job's own setup, such as
      # `actions/checkout@v4` above: that fails the job before the step runs.
      - name: Resolve every action ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One verdict word per ref, so every branch is reachable from the
          # self-check below as well as from the real tree.
          resolve() {
            case $1 in
              # A templated ref: no action ref holds `{{`, and the value
              # does not exist until the matrix expands.
              *'{{'*)         echo templated; return ;;
              ./*|docker://*) echo skipped;   return ;;
            esac
            case $1 in
              */*@*) rev=${1#*@}; path=${1%@*} ;;
              */*)   rev=;        path=$1 ;;
              *)     echo malformed; return ;;
            esac
            # `owner/repo/sub/dir@ref` is a subdirectory action: the ref lives
            # on `owner/repo`, and asking the registry about the subdirectory
            # 404s. `github/codeql-action/init@v3` is the canonical one.
            repo=$(printf '%s\n' "$path" | cut -d/ -f1,2)
            if [ -z "$rev" ]; then
              gh api "repos/$repo" >/dev/null 2>&1 && echo unpinned || echo UNRESOLVED
              return
            fi
            if gh api "repos/$repo/git/ref/tags/$rev" >/dev/null 2>&1 \
              || gh api "repos/$repo/git/ref/heads/$rev" >/dev/null 2>&1 \
              || gh api "repos/$repo/commits/$rev" >/dev/null 2>&1; then
              echo resolves
            else
              echo UNRESOLVED
            fi
          }

          # Every branch of `resolve`, including the forms this repository does
          # not use today, so none of them is code no run exercises.
          echo '-- self-check'
          bad=0
          for pair in \
            'actions/checkout@v4=resolves' \
            'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683=resolves' \
            'github/codeql-action/init@v3=resolves' \
            'actions/setup-node@main=resolves' \
            'astral-sh/setup-uv@v10=UNRESOLVED' \
            './.github/actions/local=skipped' \
            'docker://alpine:3.20=skipped' \
            'actions/checkout=unpinned' \
            'not-a-ref=malformed'
          do
            got=$(resolve "${pair%=*}")
            if [ "$got" = "${pair##*=}" ]; then
              echo "  ok        ${pair%=*} -> $got"
            else
              echo "  BAD       ${pair%=*} -> $got (wanted ${pair##*=})"
              bad=1
            fi
          done
          templated='$'"{{ matrix.action }}"
          got=$(resolve "$templated")
          if [ "$got" = templated ]; then
            echo "  ok        a templated ref -> templated"
          else
            echo "  BAD       a templated ref -> $got (wanted templated)"
            bad=1
          fi
          test "$bad" = 0 || { echo 'the ref classifier does not behave as documented'; exit 1; }

          echo '-- this repository'
          status=0
          refs=$(grep -hE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]]' \
            .github/workflows/*.yml \
            | sed -E -e 's/^.*uses:[[:space:]]*//' -e 's/[[:space:]]*#.*$//' \
                     -e 's/[[:space:]]*$//' -e 's/^["'"'"']//' -e 's/["'"'"']$//' \
            | sort -u)
          test -n "$refs" || { echo 'no action refs found, which cannot be right'; exit 1; }
          for ref in $refs; do
            verdict=$(resolve "$ref")
            case $verdict in
              resolves|unpinned|skipped|templated) echo "  $verdict  $ref" ;;
              *) echo "  $verdict  $ref"; status=1 ;;
            esac
          done
          exit $status
      # actionlint checks every workflow's syntax, expressions and `run:`
      # scripts (through shellcheck). It does not check that an action ref
      # resolves, which is why the step above exists beside it.
      - name: actionlint
        run: mise run actionlint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      # Coverage runs the same suite as `check`, so it needs the same programs;
      # without them the differential tests fail here too. The uv pin is the
      # same one, and so is the exact-release-tag ref, for the reasons written
      # out in `check`. So are the user-namespace provisions.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Allow unprivileged user namespaces with subordinate ids
        run: |
          sudo apt-get install -y uidmap
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          user=$(id -un)
          for file in /etc/subuid /etc/subgid; do
            grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
          done
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
      # The same task pre-push runs: it enforces the threshold, prints the
      # summary and writes lcov.info for the upload below.
      - name: Coverage
        run: mise run coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  mutants:
    name: Mutation testing (diff)
    runs-on: ubuntu-latest
    # The whole crate is thousands of mutants, far past any CI budget, so a
    # pull request is held only to the mutants its own diff introduces: new
    # logic no test constrains is caught at review, where it is cheapest to
    # pin down. Pushes to master have no diff to scope it to.
    if: github.event_name == 'pull_request'
    # A wall-clock cap: a diff too large to mutate in an hour fails here rather
    # than holding a runner for the default six.
    timeout-minutes: 60
    # cargo-mutants is the only tool this job calls from the table; the rest
    # would be built from source for nothing.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the merge commit and its first parent, the base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
        with:
          install_args: cargo:cargo-mutants
      # The baseline runs the whole suite unmutated before any mutant, so the
      # job needs every program `check` provisions, for the reasons written
      # out there: zsh, the user-namespace provisions, bun and the pinned uv.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Allow unprivileged user namespaces with subordinate ids
        run: |
          sudo apt-get install -y uidmap
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          user=$(id -un)
          for file in /etc/subuid /etc/subgid; do
            grep -q "^$user:" "$file" 2>/dev/null || echo "$user:100000:65536" | sudo tee -a "$file"
          done
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
      # The checkout is the pull request merged into its base, so the merge
      # commit's first parent is the base as it stands now, and this is the
      # pull request's own change against it, whatever else master has gained.
      - name: Diff against the base
        run: git diff HEAD^1 HEAD > pr.diff
      # A diff that touches no Rust has no mutants, which cargo-mutants reports
      # and passes; a missed or timed-out mutant fails the job.
      - name: Mutants
        run: mise run mutants --in-diff pr.diff
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  bench:
    name: Shell startup budget
    runs-on: ubuntu-latest
    # bx runs at every shell start, so "fast enough to forget" is a product
    # requirement — and an unmeasured requirement is one that regresses. The
    # fixture is hermetic (scratch HOME, stub tools), so this is a real gate and
    # not a measurement of the runner's mood. See bench/README.md.
    #
    # `mise run` installs every missing tool in the table before it runs a task,
    # so `install_args` alone would be undone by the Measure step. Turning that
    # off is what makes the narrowed install hold; a tool this job needs and
    # does not have fails loudly in bench/run.sh, which checks for each one.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      # The bench applies the example configuration with the real binary, and
      # `mise run bench` builds it first, so the job needs the toolchain: a
      # measurement taken without a binary would pass by measuring nothing.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # hyperfine is the only tool this job calls; the rest of the table would
      # be built from source for nothing.
      - uses: jdx/mise-action@v2
        with:
          install_args: aqua:sharkdp/hyperfine
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Measure
        run: mise run bench | tee bench-result.txt
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark
          path: |
            bench-result.txt
            bench/results/
