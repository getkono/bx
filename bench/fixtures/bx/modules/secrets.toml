# ~/.ssh/config names private hosts, so it is committed only encrypted, and
# decrypted in-process with this account's identity: ~/.ssh/id_ed25519, unless
# local.toml names another as `[secrets] identity`. The ciphertext is yours to
# make — `age -R RECIPIENTS -o secrets/ssh_config.age` — so this example ships
# the declaration without one, and an account that has none switches the
# target off in its local.toml:
#
#   [[target]]
#   path    = "~/.ssh/config"
#   enabled = false
[[target]]
path   = "~/.ssh/config"
secret = "secrets/ssh_config.age"
mode   = "0600"
