format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$character"""

add_newline = false

[character]
success_symbol = "[➜ ](bold green)"
error_symbol = "[✗ ](bold red)"

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = true
format = '[$hostname](bold blue) '
trim_at = '.'
disabled = false

