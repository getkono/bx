[package]
name = "bx"
version = "0.1.0"
edition = "2024"
description = "An idempotent, additive Linux developer-environment manager."
authors = ["Justin Chung"]
license = "MIT"
repository = "https://github.com/getkono/bx"
homepage = "https://github.com/getkono/bx"
readme = "README.md"
keywords = ["dotfiles", "cli", "configuration", "linux", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
# bx is distributed only as a prebuilt static binary via install.sh (see
# RELEASING.md); it is not published to crates.io. The metadata above is kept
# accurate anyway so `cargo` output and any future publish are correct.
publish = false

[lib]
name = "bx"
path = "src/lib.rs"

[[bin]]
name = "bx"
path = "src/main.rs"

# No feature gates. The whole binary is one product with one install path;
# gating it would only create configurations that CI never builds.

[lints.rust]
# bx contains no `unsafe`, and the reason is specific rather than stylistic.
# `std::env::set_var` and `remove_var` are `unsafe` in edition 2024 because
# their precondition is *process-wide*: no other thread may read or write the
# environment, including through `getenv` inside libc and inside `std` itself.
# `cargo test` runs every test in threads of one process, `env::temp_dir()`
# reads TMPDIR on every `TempDir::new()`, and `detect` reads PATH, so no mutex
# this crate owns can establish it. A test that reached for
# `unsafe { set_var("HOME", …) }` would reintroduce a race whose symptom is a
# flaky failure somewhere else entirely; the environment is taken as a
# parameter instead (see `paths::home_in` and `testing`).
#
# `forbid` rather than `deny`, so no module can re-allow it, and declared here
# rather than as a crate attribute so it covers the library, the binary,
# `build.rs` and anything under `tests/` alike — which is exactly where someone
# would reach for it.
unsafe_code = "forbid"

[dependencies]
# CLI surface + dynamic completions (values come from `bx __complete`).
clap = { version = "4.6.6", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.6.9"
# Interactive prompts for `init` and every confirmation. There is no TUI.
inquire = "0.9.4"
# Rendering: diffs for `plan`, colour, progress.
similar = "3.2.0"
owo-colors = "4.4.0"
anstyle = "1.0.14"
indicatif = "0.18.6"
# Secrets: age in-process, so the static binary needs no external `age`/`sops`.
# The default identity is the user's existing ssh ed25519 key, which age
# supports natively — hence the `ssh` feature.
age = { version = "0.12.1", features = ["ssh"] }
# Machine-owned state (ledger, fingerprints, write-ahead journal). MessagePack,
# not JSON: same data model, but length-prefixed rather than delimited and with
# a native binary type, so restore hashes and file modes need no base64.
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
# Hand-authored config (bx.toml, modules/*.toml, local.toml) and surgical,
# comment-preserving edits to other tools' TOML — cargo, mise, uv.
toml_edit = { version = "0.25.14", features = ["serde"] }
# Quoting and splitting when generating shell fragments and reading tool output.
shell-words = "1.1.1"
# Content addressing for the restore store, and activation-cache fingerprints.
sha2 = "0.11.0"
# XDG base directories, resolved from the environment rather than assumed.
etcetera = "0.11.0"
# Atomic writes: temp file in the destination directory, fsync, rename.
tempfile = "3.27.0"
# File modes, fsync, and the advisory lock on the state directory.
rustix = { version = "1.1.4", features = ["fs", "process"] }
thiserror = "2.0.20"
eyre = "0.6.14"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"

[profile.release]
# bx is a short-lived, frequently-installed binary fetched over the network:
# size and startup dominate, throughput does not.
lto = "thin"
codegen-units = 1
strip = true
