name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    # Only PRs carry an unmerged commit series worth linting; pushes to master are history.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # convco needs full history to walk the commit range
      # convco is a `cargo:` tool, so mise builds it from source and the build
      # needs a toolchain that is pinned here rather than whatever the runner
      # image happens to carry.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mise provisions convco (see mise.toml); the install is cached across
      # runs. Only convco is installed: this job runs nothing else, and building
      # the rest of the table from source is time spent on tools it never calls.
      - uses: jdx/mise-action@v2
        with:
          install_args: cargo:convco
      - name: Conventional Commits check
        run: convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      # env_guard's strongest evidence is differential: it holds its grammar
      # against what real bash, zsh, bun and uv actually do with a value. A
      # missing program fails those tests rather than skipping them, so the
      # runner has to supply every one of them or the property never runs. bash
      # is on the image already.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: oven-sh/setup-bun@v2
      # uv is pinned, not floated. `Reason::DeclaredRootItself` exists because
      # uv derives its executable directory as `$XDG_DATA_HOME/../bin`, and the
      # test that holds the rule to a real uv was written against the version
      # below. Floating it would let a uv release turn this red at a time
      # nobody chose. When uv does change that layout,
      # `uv_puts_executables_beside_its_data_home_and_the_guard_refuses_a_root`
      # fails on its `dir --bin` assertion at the commit that raises the pin,
      # where the rule can be re-derived deliberately — which is the point.
      #
      # It comes from the action rather than from mise.toml's [tools] because
      # mise puts a *shim* on PATH — `core.addPath(<miseDir>/shims)`, run
      # unconditionally at src/index.ts:69-71 of mise-action@v2, with no input
      # to disable it — and a shim resolves the real binary out of mise's data
      # directory, which `miseDir()` finds through MISE_DATA_DIR, XDG_DATA_HOME
      # then the home. The test spawns uv with `env_clear()` and redirects both
      # of the latter two into a scratch temporary directory, so a shim there
      # reports "uv is not a valid shim" and the test fails on `an installed uv
      # runs` instead.
      #
      # The ref is an exact release tag, and that is a deliberate departure from
      # the floating major every other action here uses. setup-uv publishes no
      # floating major past v7 — v8, v9 and v10 exist only as release series —
      # so `@v10` does not resolve and `@v7` would mean choosing a three-major-
      # old action to match a tag shape. An exact tag pins the action's
      # *version*, where a floating major does not; it is not immutable, since
      # a tag can be force-moved, and only a commit SHA would be. Readability
      # won that trade here. The cost is that a human bumps it, which is the
      # same deliberate bump the uv version pin above already asks for.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
      - name: Check formatting
        run: mise run format-check
      - name: Clippy
        run: mise run lint
      - name: Test
        run: mise run test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    # install.sh runs on machines that have nothing else on them, so a bug there
    # is the one bug a user cannot work around. bench/run.sh gates the startup
    # budget, so a bug there silently disables that gate.
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh bench/run.sh bench/stubs/gen.sh
      # An action ref that does not resolve fails every job that uses it at
      # `Set up job`, having run no step — so the jobs that would have caught a
      # problem are exactly the ones that never start. Nothing else here would
      # notice: actionlint does not check whether a ref exists, and was clean
      # over this file while `astral-sh/setup-uv@v10`, which resolves to
      # nothing, stood in it. Resolving each ref against the registry is the
      # check that does catch it, which is why it is a step and not a habit.
      #
      # Tags, branches and commit SHAs are all accepted, so pinning a ref
      # harder never fails this.
      #
      # The match is anchored at both ends so that a whole line must *be* a
      # `uses:` entry. An unanchored pattern matches this step's own source —
      # the extraction below contains the string it greps for — and then tries
      # to resolve fragments of its own sed script.
      - name: Resolve every action ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          refs=$(grep -hE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]]+[[:space:]]*$' \
            .github/workflows/*.yml | sed -E 's/^.*uses:[[:space:]]*//' | sort -u)
          test -n "$refs" || { echo 'no action refs found, which cannot be right'; exit 1; }
          for ref in $refs; do
            repo=${ref%@*}
            rev=${ref#*@}
            if gh api "repos/$repo/git/ref/tags/$rev" >/dev/null 2>&1 \
              || gh api "repos/$repo/git/ref/heads/$rev" >/dev/null 2>&1 \
              || gh api "repos/$repo/commits/$rev" >/dev/null 2>&1; then
              echo "resolves    $ref"
            else
              echo "UNRESOLVED  $ref"
              status=1
            fi
          done
          exit $status
      # actionlint is deliberately *not* wired in here. It would not have
      # caught the unresolvable ref — it was clean over this file while that
      # ref stood — and at this head it reports a real pre-existing SC2155 in
      # release-plz.yml, a file outside this change's scope. Adding it scoped
      # to ci.yml alone would be a linter that skips the one workflow with a
      # known finding, which is worse than not claiming the check. Wiring it in
      # belongs with the change that fixes release-plz.yml.

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      # Coverage runs the same suite as `check`, so it needs the same programs;
      # without them the differential tests fail here too. The uv pin is the
      # same one, and so is the exact-release-tag ref, for the reasons written
      # out in `check`.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.30"
      - name: Collect coverage data
        run: cargo llvm-cov --no-report
      - name: Generate lcov report and enforce threshold
        run: cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --lcov --output-path lcov.info --fail-under-lines 80
      - name: Coverage summary
        run: cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --summary-only
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  bench:
    name: Shell startup budget
    runs-on: ubuntu-latest
    # bx runs at every shell start, so "fast enough to forget" is a product
    # requirement — and an unmeasured requirement is one that regresses. The
    # fixture is hermetic (scratch HOME, stub tools), so this is a real gate and
    # not a measurement of the runner's mood. See bench/README.md.
    #
    # `mise run` installs every missing tool in the table before it runs a task,
    # so `install_args` alone would be undone by the Measure step. Turning that
    # off is what makes the narrowed install hold; a tool this job needs and
    # does not have fails loudly in bench/run.sh, which checks for each one.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      # The measurement needs no cargo, but a pinned toolchain keeps any tool
      # mise does build from source off the runner image's mood (issue #55).
      - uses: dtolnay/rust-toolchain@stable
      # hyperfine is the only tool this job calls; the rest of the table would
      # be built from source for nothing.
      - uses: jdx/mise-action@v2
        with:
          install_args: aqua:sharkdp/hyperfine
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Measure
        run: mise run bench | tee bench-result.txt
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark
          path: |
            bench-result.txt
            bench/results/
